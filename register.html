<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#133b36"><meta name="robots" content="noindex,nofollow"><title>تسجيل ورشة جديدة | ورشة</title><link rel="icon" href="assets/icon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="assets/auth.css"><script defer src="assets/cloud-config.js"></script><script defer src="assets/auth.js"></script></head><body><main class="auth-shell"><a class="brand" href="index.html"><img src="assets/icon.svg" alt="" width="48" height="48"><span>ورشة<small>إدارة صيانة الهواتف</small></span></a><section class="auth-card"><p class="eyebrow">ابدأ تنظيم ورشتك</p><h1>إنشاء حساب ورشة</h1><p class="muted">أنشئ حسابًا مستقلًا لورشتك. سيتم تفعيل الاشتراك يدويًا من الإدارة.</p><form id="register-form"><label>اسم الورشة<input name="workshopName" autocomplete="organization" minlength="2" maxlength="120" required></label><label>اسم صاحب الورشة<input name="ownerName" autocomplete="name" minlength="2" maxlength="100" required></label><label>رقم الهاتف<input name="phone" type="tel" autocomplete="tel" maxlength="40"></label><label>اسم المستخدم<input name="username" autocomplete="username"  minlength="3" maxlength="30" required><small>3–30 حرفًا أو رقمًا. يمكنك استخدام العربية أو اللاتينية والمسافات والنقطة والشرطة.</small></label><label>كلمة المرور<input name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required><small>10 أحرف على الأقل.</small></label><label>تأكيد كلمة المرور<input name="confirmPassword" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><p id="message" class="message" role="alert"></p><button class="primary" type="submit"><i class="fa-solid fa-user-plus" aria-hidden="true"></i> إنشاء حساب الورشة</button></form><p class="switch">لديك حساب؟ <a href="login.html">تسجيل الدخول</a></p></section><footer>كل ورشة ترى بياناتها الخاصة فقط.</footer></main></body></html>
