name = "reparephone"
main = "worker/index.js"
compatibility_date = "2026-10-16"
workers_dev = true

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "reparephone"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "worker/migrations"

[vars]
ALLOWED_ORIGINS = "https://imadtbn.github.io,http://localhost:8000,http://127.0.0.1:8000"
