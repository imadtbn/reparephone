<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#133b36">
  <meta name="robots" content="noindex,nofollow">
  <title>تغيير كلمة المرور | ورشة</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="assets/auth.css">
  <script defer src="assets/cloud-config.js"></script>
  <script defer src="assets/change-password.js"></script>
</head>
<body>
  <main class="auth-shell">
    <a class="brand" href="index.html"><img src="assets/icon.svg" alt="" width="48" height="48"><span>ورشة<small>إدارة صيانة الهواتف</small></span></a>
    <section class="auth-card">
      <p class="eyebrow">حماية حساب الورشة</p>
      <h1>تغيير كلمة المرور</h1>
      <p class="muted" id="intro">أدخل كلمة المرور الحالية ثم اختر كلمة مرور جديدة.</p>
      <form id="change-password-form">
        <label>كلمة المرور الحالية
          <input name="currentPassword" type="password" autocomplete="current-password" minlength="1" maxlength="128" required>
        </label>
        <label>كلمة المرور الجديدة
          <input name="newPassword" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
          <small>10 أحرف على الأقل. تجنّب إعادة استخدام كلمة مرور قديمة.</small>
        </label>
        <label>تأكيد كلمة المرور الجديدة
          <input name="confirmPassword" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
        </label>
        <p id="message" class="message" role="status" aria-live="polite"></p>
        <button class="primary" type="submit"><i class="fa-solid fa-shield-halved" aria-hidden="true"></i> حفظ كلمة المرور الجديدة</button>
      </form>
      <p class="switch"><a href="login.html">العودة إلى تسجيل الدخول</a></p>
    </section>
    <footer>بعد التغيير، تُنهى الجلسات السابقة ويُفتح حسابك بجلسة جديدة.</footer>
  </main>
</body>
</html>
