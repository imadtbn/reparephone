<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#133b36"><meta name="robots" content="noindex,nofollow"><title>تسجيل الدخول | ورشة</title><link rel="icon" href="assets/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/auth.css"><script defer src="assets/cloud-config.js"></script><script defer src="assets/auth.js"></script></head><body><main class="auth-shell"><a class="brand" href="index.html"><img src="assets/icon.svg" alt="" width="48" height="48"><span>ورشة<small>إدارة صيانة الهواتف</small></span></a><section class="auth-card"><p class="eyebrow">مساحة عملك بأمان</p><h1>تسجيل الدخول</h1><p class="muted">ادخل إلى لوحة ورشتك لمتابعة الأجهزة والمخزون والزبائن.</p><form id="login-form"><label>اسم المستخدم<input name="username" autocomplete="username" minlength="3" maxlength="30" required></label><label>كلمة المرور<input name="password" type="password" autocomplete="current-password" required></label><p id="message" class="message" role="alert"></p><button class="primary" type="submit">دخول إلى الورشة</button></form><p class="switch">ليس لديك حساب؟ <a href="register.html">سجّل ورشتك مجانًا</a></p><p class="hint">الحساب الجديد يحتاج إلى تفعيل الاشتراك من الإدارة قبل استخدام مساحة العمل.</p></section><footer>بيانات كل ورشة منفصلة عن الورش الأخرى.</footer></main></body></html>
